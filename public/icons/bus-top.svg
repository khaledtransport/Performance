<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 72" width="40" height="72">
  <!-- الجسم الرئيسي للباص (مستطيل مع زوايا مدورة) -->
  <rect x="4" y="6" width="32" height="60" rx="7" ry="7" fill="#1A73E8" stroke="#0d4fa3" stroke-width="1.5"/>
  <!-- الزجاج الأمامي (للأعلى = الشمال = اتجاه الحركة) -->
  <rect x="7" y="8" width="26" height="14" rx="4" ry="4" fill="#a8d8ff" opacity="0.85"/>
  <!-- الزجاج الخلفي -->
  <rect x="7" y="50" width="26" height="10" rx="3" ry="3" fill="#a8d8ff" opacity="0.55"/>
  <!-- باب جانبي أيمن -->
  <rect x="28" y="28" width="6" height="14" rx="2" ry="2" fill="#0d4fa3" opacity="0.6"/>
  <!-- نافذة يمين -->
  <rect x="29" y="20" width="5" height="7" rx="1.5" ry="1.5" fill="#cde8ff" opacity="0.7"/>
  <rect x="29" y="43" width="5" height="7" rx="1.5" ry="1.5" fill="#cde8ff" opacity="0.7"/>
  <!-- نافذة يسار -->
  <rect x="6" y="20" width="5" height="7" rx="1.5" ry="1.5" fill="#cde8ff" opacity="0.7"/>
  <rect x="6" y="43" width="5" height="7" rx="1.5" ry="1.5" fill="#cde8ff" opacity="0.7"/>
  <!-- مصابيح أمامية -->
  <circle cx="10" cy="11" r="2.5" fill="#fff9a0" opacity="0.95"/>
  <circle cx="30" cy="11" r="2.5" fill="#fff9a0" opacity="0.95"/>
  <!-- مصابيح خلفية -->
  <rect x="7" y="61" width="7" height="3" rx="1.5" fill="#ff4444" opacity="0.85"/>
  <rect x="26" y="61" width="7" height="3" rx="1.5" fill="#ff4444" opacity="0.85"/>
  <!-- رقم رمزي في المنتصف -->
  <rect x="12" y="30" width="16" height="12" rx="3" fill="#0a3d8f" opacity="0.4"/>
</svg>

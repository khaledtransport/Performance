<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 88" width="64" height="88">
  <!--
    أيقونة الباص — قالب للتصميم المخصص
    الأبعاد: 64×88 بكسل (تعرض على الخريطة بـ 32×44)
    الاتجاه: مقدمة السيارة للأعلى (شمال = 0°)
    
    ★ لاستبدال هذه الأيقونة:
    1. صمم أيقونة بنفس الأبعاد (64×88 أو 128×176 للشاشات عالية الدقة)
    2. تأكد أن مقدمة السيارة/الباص تتجه للأعلى
    3. احفظ الملف كـ PNG أو SVG
    4. ضعه في: /public/icons/bus-marker-online.png (للمتصل)
    5. و: /public/icons/bus-marker-offline.png (لغير المتصل)
    6. عدّل في map-tracker.tsx السطر الذي يبدأ بـ CUSTOM_ICON_PATH
  -->
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- الجسم الرئيسي -->
    <rect x="10" y="8" width="44" height="72" rx="14" ry="16" fill="white" stroke="#CFD8DC" stroke-width="1.5"/>
    <!-- الزجاج الأمامي -->
    <path d="M14,28 L14,18 Q14,10 22,9 L42,9 Q50,10 50,18 L50,28 Q44,34 32,34 Q20,34 14,28Z" fill="#455A64" opacity="0.8"/>
    <!-- الزجاج الخلفي -->
    <path d="M16,64 L16,56 Q24,52 32,52 Q40,52 48,56 L48,64 Q42,70 32,70 Q22,70 16,64Z" fill="#607D8B" opacity="0.55"/>
    <!-- السقف -->
    <rect x="18" y="36" width="28" height="14" rx="4" fill="#F0F0F0" stroke="#CFD8DC" stroke-width="0.5"/>
    <!-- العجلات -->
    <ellipse cx="12" cy="24" rx="5" ry="3" fill="#263238" opacity="0.85"/>
    <ellipse cx="52" cy="24" rx="5" ry="3" fill="#263238" opacity="0.85"/>
    <ellipse cx="12" cy="64" rx="5" ry="3" fill="#263238" opacity="0.85"/>
    <ellipse cx="52" cy="64" rx="5" ry="3" fill="#263238" opacity="0.85"/>
    <!-- إشارات خلفية -->
    <circle cx="22" cy="76" r="3" fill="#EF5350" opacity="0.8"/>
    <circle cx="42" cy="76" r="3" fill="#EF5350" opacity="0.8"/>
    <!-- LED أمامي -->
    <line x1="22" y1="7" x2="42" y2="7" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>

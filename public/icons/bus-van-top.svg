<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 140" width="80" height="140">
  <!-- ظل خارجي / حافة بيضاء -->
  <rect x="8" y="6" width="64" height="128" rx="18" ry="18"
        fill="white" stroke="#c8d0d8" stroke-width="2.5"/>

  <!-- جسم السيارة الرئيسي (أبيض/رمادي فاتح) -->
  <rect x="12" y="10" width="56" height="120" rx="15" ry="15" fill="#f0f2f4"/>

  <!-- شريط أزرق يسار -->
  <rect x="12" y="22" width="10" height="96" rx="3" ry="3" fill="#3b9ee8"/>
  <!-- شريط أزرق يمين -->
  <rect x="58" y="22" width="10" height="96" rx="3" ry="3" fill="#3b9ee8"/>

  <!-- زجاج أمامي (للأعلى = اتجاه الحركة) -->
  <rect x="18" y="12" width="44" height="28" rx="10" ry="10" fill="#2d3748"/>
  <!-- انعكاس الزجاج الأمامي -->
  <rect x="21" y="14" width="18" height="10" rx="4" ry="4" fill="#4a5568" opacity="0.6"/>
  <rect x="42" y="14" width="14" height="10" rx="4" ry="4" fill="#4a5568" opacity="0.4"/>

  <!-- فاصل وسط الزجاج الأمامي -->
  <line x1="40" y1="13" x2="40" y2="39" stroke="#1a202c" stroke-width="2"/>

  <!-- خط فاصل بين الزجاج والجسم -->
  <line x1="14" y1="42" x2="66" y2="42" stroke="#c0c8d0" stroke-width="1.5"/>

  <!-- نوافذ جانبية يسار -->
  <rect x="13" y="50" width="9" height="16" rx="2.5" ry="2.5" fill="#b8d4ee" opacity="0.8"/>
  <rect x="13" y="72" width="9" height="16" rx="2.5" ry="2.5" fill="#b8d4ee" opacity="0.8"/>
  <rect x="13" y="94" width="9" height="14" rx="2.5" ry="2.5" fill="#b8d4ee" opacity="0.6"/>

  <!-- نوافذ جانبية يمين -->
  <rect x="58" y="50" width="9" height="16" rx="2.5" ry="2.5" fill="#b8d4ee" opacity="0.8"/>
  <rect x="58" y="72" width="9" height="16" rx="2.5" ry="2.5" fill="#b8d4ee" opacity="0.8"/>
  <rect x="58" y="94" width="9" height="14" rx="2.5" ry="2.5" fill="#b8d4ee" opacity="0.6"/>

  <!-- خط وسط الجسم (خط السقف) -->
  <line x1="40" y1="42" x2="40" y2="112" stroke="#d8dde3" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- زجاج خلفي -->
  <rect x="18" y="100" width="44" height="24" rx="8" ry="8" fill="#2d3748" opacity="0.85"/>
  <!-- انعكاس الزجاج الخلفي -->
  <rect x="21" y="102" width="16" height="8" rx="3" ry="3" fill="#4a5568" opacity="0.4"/>

  <!-- مصابيح خلفية حمراء -->
  <rect x="14" y="126" width="14" height="7" rx="3.5" ry="3.5" fill="#e53e3e" opacity="0.95"/>
  <rect x="52" y="126" width="14" height="7" rx="3.5" ry="3.5" fill="#e53e3e" opacity="0.95"/>
  <!-- بريق المصابيح الخلفية -->
  <rect x="15" y="127" width="5" height="3" rx="1.5" fill="#fc8181" opacity="0.7"/>
  <rect x="53" y="127" width="5" height="3" rx="1.5" fill="#fc8181" opacity="0.7"/>

  <!-- مقبض الباب الخلفي -->
  <rect x="33" y="130" width="14" height="3" rx="1.5" fill="#a0aab4"/>

  <!-- مرايا جانبية -->
  <rect x="5" y="28" width="8" height="5" rx="2" fill="#cbd5e0"/>
  <rect x="67" y="28" width="8" height="5" rx="2" fill="#cbd5e0"/>

  <!-- مصابيح أمامية (أبيض/أصفر فاتح) -->
  <rect x="14" y="8" width="12" height="6" rx="3" fill="#fefcbf" opacity="0.9"/>
  <rect x="54" y="8" width="12" height="6" rx="3" fill="#fefcbf" opacity="0.9"/>
</svg>
